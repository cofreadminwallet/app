  <body class="bg-[#F4F6FB] text-neutral-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased select-none min-h-screen">
    <div id="root"></div>
    <script>
      // Fallback detector if script bundle is blocked by stale cache or MIME mismatch
      setTimeout(function() {
        if (!window.__APP_MOUNTED__) {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            console.warn('[CofreAdmin] App mount timeout reached. Rendering recovery UI...');
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#F4F6FB;font-family:sans-serif;text-align:center;">' +
              '<div style="width:64px;height:64px;background:#FFF;border:3px solid #000;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;box-shadow:3px 3px 0 #000;">🛡️</div>' +
              '<h2 style="font-size:18px;font-weight:900;color:#000;margin:0 0 8px 0;">Updating CofreAdmin / Atualizando...</h2>' +
              '<p style="font-size:13px;color:#555;margin:0 0 20px 0;max-width:340px;">A fresh app version is available. Click below to refresh cache and load.<br><span style="font-size:12px;color:#777;">Uma nova versão está disponível. Clique para atualizar.</span></p>' +
              '<button onclick="window.__hardRefreshApp()" style="background:#B8F256;border:2px solid #000;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:900;color:#000;cursor:pointer;box-shadow:3px 3px 0 #000;">Refresh / Carregar Agora</button>' +
            '</div>';
          }
        }
      }, 3500);

      window.__hardRefreshApp = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        window.location.reload(true);
      };
    </script>
