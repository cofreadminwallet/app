<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="shadow192" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <linearGradient id="vaultGradient192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="dialGradient192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Background App Card -->
  <rect x="10" y="10" width="172" height="172" rx="36" fill="#F4F6FB" stroke="#000000" stroke-width="8" filter="url(#shadow192)" />

  <!-- Main Vault Body -->
  <g>
    <rect x="34" y="42" width="105" height="105" rx="20" fill="url(#vaultGradient192)" stroke="#000000" stroke-width="7" />
    <rect x="46" y="48" width="81" height="5" rx="2.5" fill="#E9D5FF" opacity="0.45" />

    <!-- Hinges -->
    <rect x="30" y="60" width="8" height="16" rx="2" fill="#581C87" stroke="#000000" stroke-width="4" />
    <rect x="30" y="113" width="8" height="16" rx="2" fill="#581C87" stroke="#000000" stroke-width="4" />

    <!-- Vault Door Wheel -->
    <circle cx="86" cy="94" r="35" fill="#581C87" stroke="#000000" stroke-width="5" />
    <circle cx="86" cy="94" r="28" fill="url(#dialGradient192)" stroke="#000000" stroke-width="5" />
    <line x1="64" y1="72" x2="108" y2="116" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <line x1="108" y1="72" x2="64" y2="116" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="86" cy="94" r="12" fill="#3B0764" stroke="#000000" stroke-width="4" />
    <circle cx="86" cy="94" r="5" fill="#B8F256" stroke="#000000" stroke-width="2.5" />
  </g>

  <!-- Lime Sliders Panel -->
  <g>
    <rect x="135" y="55" width="24" height="78" rx="8" fill="#B8F256" stroke="#000000" stroke-width="6" />
    <rect x="140" y="66" width="13" height="6" rx="3" fill="#000000" />
    <rect x="143" y="91" width="13" height="6" rx="3" fill="#000000" />
    <rect x="138" y="115" width="13" height="6" rx="3" fill="#000000" />
  </g>
</svg>
