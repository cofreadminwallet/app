<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="vaultShadowMask" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" />
    </filter>
    <linearGradient id="vaultGradientMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="dialGradientMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Full bleed safe-zone background for Android adaptive maskable icon -->
  <rect width="512" height="512" fill="#F4F6FB" />

  <!-- Centered Safe & Panel within the 66% safe zone (inner 340px) -->
  <g transform="translate(16, 16)">
    <!-- Main Vault Box -->
    <g filter="url(#vaultShadowMask)">
      <rect x="100" y="120" width="240" height="240" rx="44" fill="url(#vaultGradientMask)" stroke="#000000" stroke-width="16" />
      <rect x="126" y="134" width="188" height="12" rx="6" fill="#E9D5FF" opacity="0.45" />

      <!-- Hinges -->
      <rect x="90" y="160" width="18" height="36" rx="5" fill="#581C87" stroke="#000000" stroke-width="10" />
      <rect x="90" y="280" width="18" height="36" rx="5" fill="#581C87" stroke="#000000" stroke-width="10" />

      <!-- Safe Door Wheel -->
      <circle cx="220" cy="240" r="76" fill="#581C87" stroke="#000000" stroke-width="10" />
      <circle cx="220" cy="240" r="62" fill="url(#dialGradientMask)" stroke="#000000" stroke-width="12" />
      <line x1="172" y1="192" x2="268" y2="288" stroke="#000000" stroke-width="10" stroke-linecap="round" />
      <line x1="268" y1="192" x2="172" y2="288" stroke="#000000" stroke-width="10" stroke-linecap="round" />
      <circle cx="220" cy="240" r="26" fill="#3B0764" stroke="#000000" stroke-width="10" />
      <circle cx="220" cy="240" r="11" fill="#B8F256" stroke="#000000" stroke-width="5" />
    </g>

    <!-- Lime Sliders Panel -->
    <g filter="url(#vaultShadowMask)">
      <rect x="330" y="150" width="54" height="180" rx="16" fill="#B8F256" stroke="#000000" stroke-width="14" />
      <rect x="342" y="174" width="28" height="12" rx="6" fill="#000000" />
      <rect x="348" y="234" width="28" height="12" rx="6" fill="#000000" />
      <rect x="336" y="294" width="28" height="12" rx="6" fill="#000000" />
    </g>
  </g>
</svg>
